<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Google</title>
  <link rel="icon" id="fav" href="imgs/google.jpg">
  <link rel="stylesheet" href="css/style.css?v=3">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-pad" viewBox="0 0 24 24"><path d="M7 7h10a4 4 0 0 1 4 4v2a4 4 0 0 1-4 4h-1.5l-2-2h-3l-2 2H7a4 4 0 0 1-4-4v-2a4 4 0 0 1 4-4z"/><path d="M7 12h4M9 10v4M16 11h.01M18 13h.01"/></symbol>
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></symbol>
  <symbol id="i-shuffle" viewBox="0 0 24 24"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></symbol>
</svg>

<header class="top">
  <a class="brand" href="index.html">
    <span class="mark"><svg class="ic"><use href="#i-pad"/></svg></span>
    <span id="name">TotallyMath</span>
  </a>
  <label class="search">
    <svg class="ic"><use href="#i-search"/></svg>
    <input id="q" type="search" placeholder="Search games" autocomplete="off" spellcheck="false">
  </label>
</header>

<main>
  <div class="grid" id="grid"></div>
  <p class="empty" id="empty" hidden>No games match that search.</p>
</main>

<nav class="dock">
  <button class="ib" id="bHome"    aria-label="Home"><svg class="ic"><use href="#i-home"/></svg></button>
  <button class="ib" id="bSearch"  aria-label="Search"><svg class="ic"><use href="#i-search"/></svg></button>
  <button class="ib" id="bRandom"  aria-label="Random game"><svg class="ic"><use href="#i-shuffle"/></svg></button>
</nav>

<script src="js/games.js?v=3"></script>
<script src="js/main.js?v=3"></script>
</body>
</html>
